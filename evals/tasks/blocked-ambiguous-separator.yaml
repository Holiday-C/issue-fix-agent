title: Use the preferred pair separator
description: Replace the current pair separator with the preferred separator. The product decision identifying that separator has not been provided.
acceptance_criteria:
  - formatPair uses the preferred separator
allowed_paths:
  - src/format.js
verification:
  - executable: node
    args: [test/approval-required.js]
limits:
  max_iterations: 4
  max_changed_files: 1
  timeout_minutes: 1
