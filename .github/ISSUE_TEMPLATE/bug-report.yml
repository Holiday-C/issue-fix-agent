name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened? Redact all credentials and sensitive repository content.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include exact steps and a minimal safe fixture when possible.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 24, Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or trace excerpt
      description: Do not include API keys, secrets, private source code, or hidden model reasoning.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and sensitive data from this report.
          required: true
